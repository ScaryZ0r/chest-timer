<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TT Coins</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #09090f;
    color: white;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid #252530;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    color: #fe2c55;
}

.wallet {
    background: #181820;
    border: 1px solid #30303b;
    padding: 12px;
    border-radius: 14px;
    font-weight: bold;
}

.wallet span {
    color: #25f4ee;
}

main {
    max-width: 900px;
    margin: auto;
    padding: 35px 15px;
}

.hero {
    text-align: center;
    margin-bottom: 35px;
}

.hero h1 {
    font-size: 38px;
    margin: 20px 0;
}

.gradient {
    background: linear-gradient(90deg, #fe2c55, #25f4ee);
    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    color: #999;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card {
    background: linear-gradient(145deg, #1b1b25, #101016);
    border: 1px solid #30303b;
    border-radius: 20px;
    padding: 25px 10px;
    text-align: center;
    cursor: pointer;
    transition: .2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #fe2c55;
}

.card.active {
    border: 2px solid #fe2c55;
    background: #25131c;
}

.coin {
    font-size: 40px;
    margin-bottom: 15px;
}

.amount {
    font-size: 21px;
    font-weight: bold;
}

.price {
    color: #fe6381;
    margin-top: 10px;
    font-weight: bold;
}

.order {
    margin-top: 25px;
    padding: 25px;
    border-radius: 20px;
    background: #15151d;
    border: 1px solid #30303b;
}

.order h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    background: #0c0c12;
    border: 1px solid #30303b;
    color: white;
    margin-top: 10px;
    font-size: 16px;
}

.profile {
    display: none;
    align-items: center;
    gap: 12px;
    margin-top: 15px;
    padding: 15px;
    background: #20202a;
    border-radius: 15px;
}

.avatar {
    width: 50px;
    height: 50px;
    background: linear-gradient(135deg, #fe2c55, #25f4ee);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 22px;
    font-weight: bold;
}

.profile a {
    color: #25f4ee;
    margin-left: auto;
    text-decoration: none;
}

.summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 25px 0;
}

.total {
    font-size: 32px;
    font-weight: bold;
    color: #fe6381;
}

button {
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(90deg, #fe2c55, #ff4d83);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    filter: brightness(1.1);
}

#notice {
    text-align: center;
    margin-top: 15px;
    color: #25f4ee;
}

.flying {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    font-size: 28px;
    animation: fly 1.4s forwards;
}

@keyframes fly {
    0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0);
    }
    100% {
        opacity: 0;
        transform: translate(var(--x), var(--y)) rotate(500deg);
    }
}

@media (min-width: 600px) {
    .grid {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">♪ TT COINS</div>

    <div class="wallet">
        👛 <span id="balance">$1,000,000</span>
    </div>
</header>

<main>

<section class="hero">
    <h1>
        Монеты TikTok<br>
        <span class="gradient">для любимых авторов 💸</span>
    </h1>

    <p>Выбирай пакет монет и пополняй баланс</p>
</section>

<div class="grid" id="packages">

<div class="card active" data-coins="70" data-price="1.29">
    <div class="coin">🪙</div>
    <div class="amount">70 монет</div>
    <div class="price">$1.29</div>
</div>

<div class="card" data-coins="350" data-price="5.99">
    <div class="coin">💰</div>
    <div class="amount">350 монет</div>
    <div class="price">$5.99</div>
</div>

<div class="card" data-coins="700" data-price="11.99">
    <div class="coin">🪙</div>
    <div class="amount">700 монет</div>
    <div class="price">$11.99</div>
</div>

<div class="card" data-coins="1400" data-price="23.99">
    <div class="coin">💸</div>
    <div class="amount">1,400 монет</div>
    <div class="price">$23.99</div>
</div>

<div class="card" data-coins="3500" data-price="59.99">
    <div class="coin">💰</div>
    <div class="amount">3,500 монет</div>
    <div class="price">$59.99</div>
</div>

<div class="card" data-coins="7000" data-price="119.99">
    <div class="coin">💎</div>
    <div class="amount">7,000 монет</div>
    <div class="price">$119.99</div>
</div>

</div>

<section class="order">

<h2>🪙 Покупка монет</h2>

<label for="nick">TikTok никнейм</label>
<input id="nick" placeholder="@username">

<div class="profile" id="profile">
    <div class="avatar" id="avatar">T</div>

    <div>
        <b id="profileName">@username</b>
        <div style="color:#999;font-size:12px;margin-top:5px">
            TikTok аккаунт
        </div>
    </div>

    <a id="profileLink" target="_blank">Открыть ↗</a>
</div>

<div class="summary">
    <div>
        <div style="color:#999">К оплате</div>
        <div class="total" id="total">$1.29</div>
    </div>

    <div id="count">70 монет</div>
</div>

<button id="buy">Купить монеты ✨</button>

<div id="notice"></div>

</section>

</main>

<script>

let wallet = 1000000;

let selected = {
    coins: 70,
    price: 1.29
};

const cards = document.querySelectorAll(".card");

function updateWallet() {
    document.getElementById("balance").textContent =
        "$" + wallet.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
}

cards.forEach(card => {

    card.addEventListener("click", () => {

        cards.forEach(c => c.classList.remove("active"));

        card.classList.add("active");

        selected = {
            coins: Number(card.dataset.coins),
            price: Number(card.dataset.price)
        };

        document.getElementById("total").textContent =
            "$" + selected.price.toFixed(2);

        document.getElementById("count").textContent =
            selected.coins.toLocaleString("en-US") + " монет";

    });

});

const nick = document.getElementById("nick");

nick.addEventListener("input", () => {

    let name = nick.value.trim().replace(/^@/, "");

    if (/^[a-zA-Z0-9._]{2,24}$/.test(name)) {

        document.getElementById("profile").style.display = "flex";

        document.getElementById("profileName").textContent =
            "@" + name;

        document.getElementById("avatar").textContent =
            name[0].toUpperCase();

        document.getElementById("profileLink").href =
            "https://www.tiktok.com/@" + encodeURIComponent(name);

    } else {

        document.getElementById("profile").style.display = "none";

    }

});

function animation(x, y) {

    const icons = ["🪙", "💵", "💸", "💰", "✨", "$"];

    for (let i = 0; i < 30; i++) {

        let coin = document.createElement("span");

        coin.className = "flying";

        coin.textContent =
            icons[Math.floor(Math.random() * icons.length)];

        coin.style.left = x + "px";
        coin.style.top = y + "px";

        coin.style.setProperty(
            "--x",
            (Math.random() * 500 - 250) + "px"
        );

        coin.style.setProperty(
            "--y",
            (-Math.random() * 400 - 50) + "px"
        );

        document.body.appendChild(coin);

        setTimeout(() => coin.remove(), 1500);

    }

}

document.getElementById("buy").addEventListener("click", event => {

    let username = nick.value.trim().replace(/^@/, "");

    const notice = document.getElementById("notice");

    if (!/^[a-zA-Z0-9._]{2,24}$/.test(username)) {

        notice.style.color = "#fe6381";
        notice.textContent = "Введите правильный TikTok никнейм";

        return;

    }

    if (wallet < selected.price) {

        notice.style.color = "#fe6381";
        notice.textContent = "Недостаточно денег в кошельке";

        return;

    }

    wallet -= selected.price;

    updateWallet();

    const rect = event.currentTarget.getBoundingClientRect();

    animation(
        rect.left + rect.width / 2,
        rect.top
    );

    notice.style.color = "#25f4ee";

    notice.textContent =
        "✨ Покупка оформлена! @" +
        username +
        " · " +
        selected.coins +
        " монет";

});

updateWallet();

</script>

</body>
</html>
